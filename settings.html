<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="dashboard-page">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <aside class="sidebar">
            <div class="sidebar-header"><a href="index.html" class="logo"><span class="logo-icon">📊</span><span class="logo-text">SocialMetrics</span></a></div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></a>
                <a href="reports.html" class="nav-item"><span class="nav-icon">📄</span><span class="nav-label">My Reports</span></a>
                <a href="billing.html" class="nav-item"><span class="nav-icon">💳</span><span class="nav-label">Billing</span></a>
                <a href="settings.html" class="nav-item active"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></a>
            </nav>
            <div class="sidebar-footer">
                <div class="user-profile"><div class="user-avatar">JD</div><div class="user-info"><div class="user-name">John</div><div class="user-email">user@example.com</div></div></div>
                <button class="btn-logout"><span>🚪</span><span>Logout</span></button>
            </div>
        </aside>
        <main class="dashboard-main">
            <div class="dashboard-header"><div class="header-left"><h1>Settings</h1><p>Manage your account preferences</p></div></div>
            <section style="background: var(--bg-card); padding: 2rem; border-radius: var(--radius-lg); margin-bottom: 2rem;">
                <h2 class="section-heading">Account Information</h2>
                <div style="display: grid; gap: 1.5rem; max-width: 600px;">
                    <div><label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Email</label><input type="email" id="email" readonly style="width: 100%; padding: 0.875rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary);"></div>
                    <div><label style="display: block; margin-bottom: 0.5rem; font-weight: 600;">Name</label><input type="text" id="name" style="width: 100%; padding: 0.875rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary);"></div>
                </div>
            </section>
            <section style="background: var(--bg-card); padding: 2rem; border-radius: var(--radius-lg); margin-bottom: 2rem;">
                <h2 class="section-heading">Notifications</h2>
                <div style="display: grid; gap: 1rem;">
                    <label style="display: flex; align-items: center; cursor: pointer;"><input type="checkbox" id="emailNotif" checked style="margin-right: 0.75rem; width: 18px; height: 18px;"><span>Email notifications</span></label>
                    <label style="display: flex; align-items: center; cursor: pointer;"><input type="checkbox" id="reportNotif" checked style="margin-right: 0.75rem; width: 18px; height: 18px;"><span>Report ready notifications</span></label>
                    <label style="display: flex; align-items: center; cursor: pointer;"><input type="checkbox" id="marketingNotif" style="margin-right: 0.75rem; width: 18px; height: 18px;"><span>Marketing emails</span></label>
                </div>
            </section>
            <div style="display: flex; gap: 1rem;">
                <button onclick="saveSettings()" class="btn-primary" style="padding: 1rem 2rem;">Save Changes</button>
                <button onclick="window.location.href='dashboard.html'" class="btn-secondary" style="padding: 1rem 2rem;">Cancel</button>
            </div>
        </main>
    </div>
    <script src="js/settings.js"></script>
    <script>
    const SUPABASE_URL = "https://mtqnkdblgieliqkthasc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im10cW5rZGJsZ2llbGlxa3RoYXNjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDAyNjIsImV4cCI6MjA4NTI3NjI2Mn0.-trmIlrF9SUnrEJD9Y-K3doiPcT0YOwiwtLwQtixh0I";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkAuth() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) {
            window.location.replace("login.html");
        } else {
            // Optional: Populate user info in sidebar if you have the same IDs there
            document.getElementById('userName').textContent = session.user.email.split('@')[0];
        }
    }
    checkAuth();
</script>
</body>
</html>
